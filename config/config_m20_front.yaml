%YAML:1.0

# Scene config for the DEEPRobotics M20 front LiDAR + Intel RealSense D435i
# color camera. Derived from config_outdoor.yaml.

# Topic name in the rosbag
PointCloudTopic: "/lidar_points_front"
ImageTopic: "/camera/camera/color/image_raw"

# Lidar Data type(custom msg or pointcloud2)
Data.custom_msg: 0

# Initial extrinsic (LiDAR -> camera, i.e. p_cam = R * p_lidar + t).
#
# Composed from the measured D435i extrinsic in the *fused* LiDAR frame
# (2026-08-26), which is the body frame:
#   Rcl = [-0.030018 -0.999401 -0.017245      Pcl = [ 0.042863
#          -0.094445  0.020012 -0.995329              0.224914
#           0.995077 -0.028249 -0.094990]            -0.234539]
# and the base_link -> front LiDAR transform read from /tf_static:
#   R_bf = [0 0 1        t_bf = [0.320, 0, -0.013]
#           0 -1 0
#           1 0 0]
# Note that frame is NOT body-aligned: the LiDAR's own +Z is body-forward and
# its +X is body-up, so the rotation matters as much as the offset.
#   p_cam = Rcl * (R_bf * p_front + t_bf) + Pcl
#         = (Rcl * R_bf) * p_front + (Rcl * t_bf + Pcl)
# The camera then sits at (0.215324, -0.031711, -0.064087) m in the
# front-LiDAR frame with its optical axis along front-LiDAR +Z, i.e. looking
# forward, as expected.
ExtrinsicMat: !!opencv-matrix
  rows: 4
  cols: 4
  dt: d
  data: [-0.017245,  0.999401, -0.030018,  0.033481,
         -0.995329, -0.020012, -0.094445,  0.207631,
         -0.094990,  0.028249,  0.995077,  0.085121,
          0.0,       0.0,       0.0,       1.0]

# Params for Canny Edge Extraction
Canny.gray_threshold: 20
Canny.len_threshold: 200

# Params for Voxel Cutting & Plane Fitting & Edge Extraction
Voxel.size: 1.0
Voxel.down_sample_size: 0.02
Plane.min_points_size: 60
Plane.normal_theta_min: 30
Plane.normal_theta_max: 150
Plane.max_size: 5
Ransac.dis_threshold: 0.015
Ransac.iter_num: 200
Edge.min_dis_threshold: 0.03
Edge.max_dis_threshold: 0.06

# Params for color point clouds
Color.dense: 1
Color.intensity_threshold: 10

# Params for projecting the cloud into the image
# Indoor scene: the outdoor default of 2.5 m discards everything in the middle
# of the room (cabinet, boxes, the robot's own mast), which is most of the
# usable edge geometry. 1.0 m keeps that while still excluding the sensor's
# near blind zone.
Projection.min_depth: 1.0
Projection.max_depth: 30.0
# The M20 front LiDAR has a wide FOV, so reject anything at or behind the
# camera plane before projecting.
Projection.min_camera_depth: 0.1
